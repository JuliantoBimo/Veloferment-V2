<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeloFerment - Elevasi Produksi Tempe Presisi</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1',
                        accent: '#a855f7',
                        'bg-dark': '#0a0a0f',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                },
            },
        };
    </script>

    <style type="text/tailwindcss">
        @layer base {
            body {
                @apply bg-bg-dark text-white font-sans antialiased;
            }
        }
        @layer components {
            .glass {
                @apply bg-white/5 backdrop-blur-xl border border-white/10;
            }
            .text-glow {
                text-shadow: 0 0 20px rgba(99, 102, 241, 0.5);
            }
        }
        
        /* Smooth Scroll */
        html {
            scroll-behavior: smooth;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0f;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e1e2e;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6366f1;
        }
    </style>

    <!-- Load React & Babel for Standalone Execution -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Load Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Load Recharts (Charts library) -->
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { 
            ResponsiveContainer, AreaChart, Area, XAxis, YAxis, CartesianGrid, Tooltip, Line 
        } = Recharts;

        // --- Mock Data for Simulator ---
        const generateSimData = () => Array.from({ length: 24 }, (_, i) => ({
            time: `${i}:00`,
            temp: 28 + Math.sin(i / 4) * 2 + Math.random() * 0.5,
            humidity: 75 + Math.cos(i / 6) * 5 + Math.random() * 1,
            progress: Math.min(100, (i / 20) * 100).toFixed(0)
        }));

        const SIM_DATA = generateSimData();

        // --- Components ---

        const Icon = ({ name, className = "" }) => {
            useEffect(() => {
                lucide.createIcons();
            }, []);
            return <i data-lucide={name} className={className}></i>;
        };

        const Navbar = () => {
            const [isOpen, setIsOpen] = useState(false);
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 20);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <nav className={`fixed top-0 w-full z-50 transition-all duration-300 ${scrolled ? 'glass py-3' : 'bg-transparent py-6'}`}>
                    <div className="container mx-auto px-6 flex justify-between items-center">
                        <div className="flex items-center gap-2">
                            <div className="w-8 h-8 bg-primary rounded flex items-center justify-center shadow-[0_0_15px_rgba(99,102,241,0.5)]">
                                <Icon name="sprout" className="text-white w-5 h-5" />
                            </div>
                            <span className="text-xl font-bold tracking-tighter text-white">
                                Velo<span className="text-indigo-400">Ferment</span>
                            </span>
                        </div>

                        <div className="hidden md:flex items-center gap-8 text-sm font-medium opacity-80">
                            <a href="#tech" className="hover:text-indigo-400 transition-colors">Teknologi</a>
                            <a href="#specs" className="hover:text-indigo-400 transition-colors">Spesifikasi</a>
                            <a href="#dashboard" className="hover:text-indigo-400 transition-colors">Simulasi</a>
                            <a href="#invest" className="hover:text-indigo-400 transition-colors">Investasi</a>
                            <button 
                                onClick={() => window.location.href = 'mailto:Bimojulianto24@gmail.com'}
                                className="bg-primary text-white px-5 py-2 rounded-full font-bold hover:scale-105 transition-transform shadow-lg shadow-primary/20"
                            >
                                Mulai Sekarang
                            </button>
                        </div>

                        <button className="md:hidden text-white" onClick={() => setIsOpen(!isOpen)}>
                            <Icon name={isOpen ? "x" : "menu"} />
                        </button>
                    </div>

                    {isOpen && (
                        <div className="absolute top-full left-0 w-full glass p-6 md:hidden flex flex-col gap-4 text-center border-t border-white/5 animate-in slide-in-from-top duration-300">
                            <a href="#tech" onClick={() => setIsOpen(false)}>Teknologi</a>
                            <a href="#specs" onClick={() => setIsOpen(false)}>Spesifikasi</a>
                            <a href="#dashboard" onClick={() => setIsOpen(false)}>Simulasi</a>
                            <a href="#invest" onClick={() => setIsOpen(false)}>Investasi</a>
                            <button className="bg-primary text-white px-5 py-3 rounded-xl font-bold">Konsultasi</button>
                        </div>
                    )}
                </nav>
            );
        };

        const DashboardSimulator = () => {
            return (
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div className="lg:col-span-2 glass rounded-3xl p-6 relative overflow-hidden">
                        <div className="flex justify-between items-start mb-8">
                            <div>
                                <h3 className="text-lg font-semibold flex items-center gap-2">
                                    <Icon name="activity" className="text-primary w-5 h-5" />
                                    Monitoring Real-time
                                </h3>
                                <p className="text-xs opacity-50 font-mono">Siklus: Batch #1024-A</p>
                            </div>
                            <span className="px-3 py-1 bg-green-500/20 text-green-400 text-[10px] uppercase font-bold rounded-full border border-green-500/30">
                                Active
                            </span>
                        </div>
                        
                        <div className="h-[300px] w-full">
                            <ResponsiveContainer width="100%" height="100%">
                                <AreaChart data={SIM_DATA}>
                                    <defs>
                                        <linearGradient id="colorTemp" x1="0" y1="0" x2="0" y2="1">
                                            <stop offset="5%" stopColor="#6366f1" stopOpacity={0.3}/>
                                            <stop offset="95%" stopColor="#6366f1" stopOpacity={0}/>
                                        </linearGradient>
                                    </defs>
                                    <CartesianGrid strokeDasharray="3 3" stroke="#ffffff10" vertical={false} />
                                    <XAxis dataKey="time" stroke="#ffffff30" fontSize={10} tickMargin={10} />
                                    <YAxis stroke="#ffffff30" fontSize={10} />
                                    <Tooltip 
                                        contentStyle={{ background: '#0a0a0f', border: '1px solid #ffffff20', borderRadius: '12px', backdropFilter: 'blur(10px)' }}
                                        itemStyle={{ color: '#6366f1' }}
                                    />
                                    <Area type="monotone" dataKey="temp" stroke="#6366f1" fillOpacity={1} fill="url(#colorTemp)" />
                                    <Line type="monotone" dataKey="humidity" stroke="#a855f7" strokeWidth={2} dot={false} />
                                </AreaChart>
                            </ResponsiveContainer>
                        </div>

                        <div className="flex justify-center gap-6 mt-4">
                            <div className="flex items-center gap-2">
                                <div className="w-3 h-3 bg-primary rounded-full" />
                                <span className="text-xs opacity-70 text-indigo-400">Temperatur (°C)</span>
                            </div>
                            <div className="flex items-center gap-2">
                                <div className="w-3 h-3 bg-accent rounded-full" />
                                <span className="text-xs opacity-70 text-purple-400">Kelembapan (%)</span>
                            </div>
                        </div>
                    </div>

                    <div className="flex flex-col gap-6">
                        <div className="glass rounded-3xl p-6 bg-primary/5 border-primary/20">
                            <div className="flex justify-between items-center mb-4 text-primary">
                                <span className="text-xs font-bold uppercase tracking-wider">Progress Fermentasi</span>
                                <span className="text-2xl font-mono">82%</span>
                            </div>
                            <div className="w-full h-2 bg-white/10 rounded-full overflow-hidden">
                                <div className="h-full bg-primary shadow-[0_0_15px_rgba(56,189,248,0.5)] transition-all duration-1000" style={{width: '82%'}}></div>
                            </div>
                            <p className="text-[10px] mt-4 opacity-40 leading-relaxed italic">
                                *AI Prediksi: Matang dalam 4 jam 12 menit berdasarkan Logika Fuzzy Sugeno.
                            </p>
                        </div>

                        <div className="grid grid-cols-2 gap-4">
                            <div className="glass rounded-2xl p-4 flex flex-col gap-1">
                                <Icon name="thermometer" className="text-primary w-4 h-4 mb-2" />
                                <span className="text-[10px] opacity-40 uppercase">Suhu Ruang</span>
                                <span className="text-xl font-mono">30.2°C</span>
                            </div>
                            <div className="glass rounded-2xl p-4 flex flex-col gap-1">
                                <Icon name="droplets" className="text-accent w-4 h-4 mb-2" />
                                <span className="text-[10px] opacity-40 uppercase">Kelembapan</span>
                                <span className="text-xl font-mono">78%</span>
                            </div>
                            <div className="glass rounded-2xl p-4 flex flex-col gap-1">
                                <Icon name="cpu" className="text-slate-400 w-4 h-4 mb-2" />
                                <span className="text-[10px] opacity-40 uppercase">Load CPU</span>
                                <span className="text-xl font-mono">12%</span>
                            </div>
                            <div className="glass rounded-2xl p-4 flex flex-col gap-1">
                                <Icon name="smartphone" className="text-slate-400 w-4 h-4 mb-2" />
                                <span className="text-[10px] opacity-40 uppercase">Status IoT</span>
                                <span className="text-xl font-mono text-green-400">ONLINE</span>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [currentTime, setCurrentTime] = useState(new Date());

            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            const formattedTime = currentTime.toLocaleString('id-ID', {
                timeZone: 'Asia/Jakarta',
                day: 'numeric',
                month: 'long',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            }) + ' WIB';

            return (
                <div className="min-h-screen relative">
                    <div className="fixed top-[-10%] left-[-10%] w-[50%] h-[50%] bg-purple-600/10 rounded-full blur-[120px] pointer-events-none -z-10" />
                    <div className="fixed bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-blue-600/10 rounded-full blur-[120px] pointer-events-none -z-10" />
                    
                    <Navbar />

                    <header className="relative pt-32 pb-20">
                        <div className="container mx-auto px-6 text-center">
                            <span className="px-4 py-1.5 rounded-full glass text-[10px] uppercase font-bold tracking-[0.2em] text-indigo-400 border border-primary/20 inline-block mb-6">
                                Industrial Grade IoT Solution
                            </span>
                            <h1 className="text-5xl md:text-7xl font-bold tracking-tight mb-8 leading-[1.1]">
                                Elevasi Produksi Tempe <br /> 
                                <span className="text-transparent bg-clip-text bg-gradient-to-r from-primary to-accent">
                                    dengan Presisi Digital.
                                </span>
                            </h1>
                            <p className="max-w-2xl mx-auto text-lg opacity-60 mb-12 leading-relaxed">
                                Tinggalkan metode tradisional yang tidak terukur. VeloFerment menghadirkan standardisasi mutu, efisiensi waktu, dan kontrol penuh produksi UMKM melalui AI & IoT.
                            </p>
                            
                            <div className="flex flex-col md:flex-row items-center justify-center gap-4">
                                <button className="bg-primary text-white px-10 py-4 rounded-2xl font-bold text-lg hover:scale-105 transition-all shadow-[0_10px_30px_rgba(99,102,241,0.3)]">
                                    Konsultasi Pemasangan
                                </button>
                                <button className="glass px-10 py-4 rounded-2xl font-bold text-lg hover:bg-white/10 transition-all border-white/5">
                                    Lihat Demo Alat
                                </button>
                            </div>
                        </div>
                    </header>

                    <section className="border-y border-white/5 py-12 bg-white/2 backdrop-blur-sm">
                        <div className="container mx-auto px-6 grid grid-cols-2 md:grid-cols-4 gap-8">
                            {[
                                { label: "Akurasi Waktu", val: "99.2%", icon: "clock" },
                                { label: "Efisiensi Energi", val: "35%", icon: "zap" },
                                { label: "Teknologi AI", val: "Fuzzy Logic", icon: "cpu" },
                                { label: "Jaringan", val: "Global IoT", icon: "activity" }
                            ].map((item, i) => (
                                <div key={i} className="flex flex-col items-center text-center gap-2">
                                    <Icon name={item.icon} className="w-5 h-5 text-indigo-400 mb-2" />
                                    <span className="text-2xl font-bold text-white font-mono tracking-tight">{item.val}</span>
                                    <span className="text-[10px] uppercase tracking-widest opacity-40 font-bold">{item.label}</span>
                                </div>
                            ))}
                        </div>
                    </section>

                    <section id="dashboard" className="py-24">
                        <div className="container mx-auto px-6">
                            <div className="flex flex-col md:flex-row justify-between items-end mb-16 gap-6">
                                <div className="max-w-xl">
                                   <h2 className="text-5xl font-bold mb-6 tracking-tight">Kontrol Penuh <br/>di Genggaman.</h2>
                                   <p className="opacity-50">Monitoring status produksi, riwayat temperatur, dan prediksi matang secara real-time melalui dashboard interaktif.</p>
                                </div>
                                <div className="glass px-6 py-4 rounded-2xl border border-primary/20">
                                     <span className="text-[10px] uppercase font-bold text-primary block mb-1">Live Monitor</span>
                                     <span className="text-lg font-mono">{formattedTime}</span>
                                </div>
                            </div>
                            <DashboardSimulator />
                        </div>
                    </section>

                    <section id="tech" className="py-24">
                        <div className="container mx-auto px-6">
                            <div className="glass rounded-[3rem] p-10 md:p-20 overflow-hidden relative">
                                <div className="grid md:grid-cols-2 gap-16 items-center">
                                    <div>
                                        <span className="text-primary font-bold text-xs uppercase tracking-widest mb-4 block">Proven Technology</span>
                                        <h2 className="text-5xl font-bold mb-8 leading-tight">Berbasis Riset Akademik yang Tervalidasi.</h2>
                                        <div className="space-y-6">
                                            <div className="flex gap-4">
                                                <div className="w-10 h-10 rounded-full bg-primary/20 flex items-center justify-center shrink-0">
                                                    <Icon name="shield-check" className="w-5 h-5 text-primary" />
                                                </div>
                                                <div>
                                                    <h4 className="font-bold mb-1">Universitas Diponegoro</h4>
                                                    <p className="text-sm opacity-50">Dikembangkan berdasarkan publikasi di Jurnal Ilmiah Transient UNDIP.</p>
                                                </div>
                                            </div>
                                            <div className="flex gap-4">
                                                <div className="w-10 h-10 rounded-full bg-primary/20 flex items-center justify-center shrink-0">
                                                    <Icon name="activity" className="w-5 h-5 text-primary" />
                                                </div>
                                                <div>
                                                    <h4 className="font-bold mb-1">Analisis Fuzzy Sugeno</h4>
                                                    <p className="text-sm opacity-50">Menjamin ketepatan waktu fermentasi yang tidak bisa dicapai secara manual.</p>
                                                </div>
                                            </div>
                                        </div>
                                        <a href="https://ejournal3.undip.ac.id/index.php/transient/article/view/40925" target="_blank" className="inline-flex items-center gap-2 mt-10 text-primary font-bold hover:gap-4 transition-all">
                                            Baca Publikasi Riset <Icon name="arrow-right" className="w-4 h-4" />
                                        </a>
                                    </div>

                                    <div className="relative group">
                                        <div className="aspect-[4/3] glass rounded-3xl overflow-hidden shadow-2xl relative border-primary/20 bg-white/5 ring-1 ring-white/10">
                                            <img 
                                                src="./Inkubator.png" 
                                                alt="Inkubator VeloFerment Industrial" 
                                                className="w-full h-full object-contain p-4 transition-transform duration-700 group-hover:scale-105"
                                                onError={(e) => {
                                                    e.target.src = 'https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?auto=format&fit=crop&q=80&w=800';
                                                }}
                                            />
                                            <div className="absolute inset-0 bg-gradient-to-t from-bg-dark/80 via-transparent to-transparent opacity-60" />
                                            <div className="absolute bottom-6 left-6 right-6">
                                                <div className="glass p-4 rounded-2xl border border-white/10 backdrop-blur-md">
                                                    <div className="flex items-center gap-3">
                                                        <div className="w-2 h-2 rounded-full bg-primary animate-pulse" />
                                                        <span className="text-[10px] uppercase font-bold tracking-widest text-white/80">Prototyping V.2.1 - Industrial Grade</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div className="absolute -bottom-6 -right-6 w-32 h-32 bg-primary/30 blur-[60px] rounded-full -z-10 transition-colors" />
                                        <div className="absolute -top-6 -left-6 w-32 h-32 bg-accent/30 blur-[60px] rounded-full -z-10 transition-colors" />
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    <section id="invest" className="py-24">
                        <div className="container mx-auto px-6 max-w-4xl text-center">
                            <h2 className="text-5xl font-bold mb-6 tracking-tight">Investasi Cerdas UMKM.</h2>
                            <p className="opacity-50 mb-16">Solusi terjangkau untuk standardisasi kapasitas produksi tinggi.</p>
                            
                            <div className="glass rounded-[2rem] p-12 border-primary/30 relative overflow-hidden">
                                <span className="text-xs font-bold uppercase tracking-widest opacity-40 mb-4 block">Paket Instalasi Panel</span>
                                <div className="text-8xl font-bold mb-4 font-mono text-glow text-indigo-400">
                                    Rp 1.5jt<span className="text-lg opacity-40 font-sans font-medium text-white">/ m²</span>
                                </div>
                                <p className="text-sm opacity-60 mb-12 max-w-md mx-auto">
                                    Harga sudah mencakup unit panel kontrol, sensor industri, dan sistem monitoring cloud selamanya.
                                </p>
                                <button className="w-full bg-primary text-white py-5 rounded-2xl font-bold text-xl hover:scale-[1.02] transition-transform">
                                    Pesan Unit Sekarang
                                </button>
                            </div>
                        </div>
                    </section>

                    <footer className="py-20 border-t border-white/5">
                        <div className="container mx-auto px-6 text-center opacity-30 text-[10px] uppercase font-bold tracking-widest">
                            &copy; 2026 Julianto Bimo. SOLUSI REKAYASA UNTUK INDUSTRI MAKANAN TERINTEGRASI.
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
