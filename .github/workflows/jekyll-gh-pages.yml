name: Build and Deploy TypeScript to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Memungkinkan Anda menjalankan action ini secara manual

# Mengatur izin token GitHub untuk melakukan deployment ke GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Menghindari bentrok deployment yang berjalan bersamaan
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # JOB 1: Melakukan kompilasi TypeScript menjadi berkas siap rilis
  build-project:
    runs-on: ubuntu-latest
    steps:
    - name: Ambil Kode dari Repositori
      uses: actions/checkout@v4

    - name: Inisialisasi Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Instalasi Dependensi Bersih
      run: npm ci

    - name: Eksekusi Perintah Build TypeScript
      run: npm run build

    # PENTING: Menyiapkan konfigurasi Pages agar dikenali GitHub
    - name: Setup Pages
      uses: actions/configure-pages@v5

    # Mengunggah folder hasil build (misal: 'dist') khusus untuk keperluan GitHub Pages
    - name: Upload Artifact untuk GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: dist/ # <--- PASTIKAN folder ini sesuai dengan folder output build Anda (dist atau dir)

  # JOB 2: Mengambil hasil dari JOB 1 dan merilisnya ke internet
  deploy-project:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-project # Menunggu proses build selesai dengan sukses
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
